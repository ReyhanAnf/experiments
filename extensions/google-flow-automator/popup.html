<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timelapse Continuity Automator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px;
      font-size: 12px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }
    .icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #042f2e;
      font-weight: 900;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .title { font-weight: 700; font-size: 13px; color: #f1f5f9; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }
    .project-name {
      font-weight: 600;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stats {
      font-family: monospace;
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 4px;
    }
    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #f8fafc;
      padding: 8px;
      font-size: 10px;
      font-family: monospace;
      outline: none;
      resize: vertical;
      margin-top: 4px;
    }
    textarea:focus { border-color: #10b981; }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      transition: all 0.15s ease;
      margin-top: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #042f2e;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #34d399, #10b981); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .status-msg {
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
      color: #34d399;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">TC</div>
    <div class="title">Google Flow Automator</div>
  </div>

  <div class="card">
    <span class="label">Proyek Aktif di Browser:</span>
    <div class="project-name" id="pop-project-name">Memuat...</div>
    <div class="stats" id="pop-project-stats">-</div>
  </div>

  <div class="card">
    <span class="label">Ganti Proyek (Tempel JSON):</span>
    <textarea id="pop-json-input" rows="3" placeholder="Tempel JSON kontinuitas proyek di sini..."></textarea>
    <button class="btn btn-primary" id="pop-btn-send">
      <span>Kirim Proyek ke Halaman</span>
    </button>
  </div>

  <button class="btn btn-secondary" id="pop-btn-open-flow">
    <span>🌐 Buka Google Labs / Flow</span>
  </button>

  <div class="status-msg" id="pop-status">✓ Proyek berhasil dikirim!</div>

  <script src="popup.js"></script>
</body>
</html>
